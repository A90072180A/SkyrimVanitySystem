name: Adapter source bundle
on:
  push:
    branches: [vanity-ube-heel-adapter-poc]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Archive committed source and identity
        run: |
          mkdir -p source-bundle
          git archive --format=zip --output=source-bundle/source.zip HEAD
          git rev-parse HEAD > source-bundle/COMMIT.txt
          sha256sum source-bundle/source.zip > source-bundle/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: VanityUBEHeelAdapter-source
          path: source-bundle
          if-no-files-found: error
