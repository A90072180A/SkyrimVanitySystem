name: Build Vanity UBE Heel Adapter POC

on:
  push:
    branches:
      - vanity-ube-heel-adapter-poc
  workflow_dispatch:

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate foot snapshot decoder with sanitizers
        run: |
          g++ -std=c++20 -O1 -g -Wall -Wextra -pedantic -fsanitize=address,undefined -fno-omit-frame-pointer plugins/VanityUBEHeelAdapter/tests/FootSnapshotCoreTests.cpp -o foot-snapshot-tests
          ./foot-snapshot-tests
      - name: Validate packed TRI parser and posture mathematics
        run: |
          g++ -std=c++20 -O1 -g -Wall -Wextra -pedantic -fsanitize=address,undefined -fno-omit-frame-pointer plugins/VanityUBEHeelAdapter/tests/TriMorphCoreTests.cpp -o tri-morph-tests
          ./tri-morph-tests
          python3 -m py_compile plugins/VanityUBEHeelAdapter/tools/audit_foot_snapshots.py
      - name: Validate live selection and retry policy
        run: |
          g++ -std=c++20 -O1 -g -Wall -Wextra -pedantic -fsanitize=address,undefined -fno-omit-frame-pointer plugins/VanityUBEHeelAdapter/tests/FootCapturePolicyTests.cpp -o foot-policy-tests
          ./foot-policy-tests
      - name: Validate source NIF and native coefficient fitting
        run: |
          g++ -std=c++20 -O1 -g -Wall -Wextra -pedantic -fsanitize=address,undefined -fno-omit-frame-pointer plugins/VanityUBEHeelAdapter/tests/NifSourceCoreTests.cpp -o nif-source-tests
          ./nif-source-tests
      - name: Validate cross-topology surface posture measurement
        run: |
          g++ -std=c++20 -O1 -g -Wall -Wextra -pedantic -fsanitize=address,undefined -fno-omit-frame-pointer plugins/VanityUBEHeelAdapter/tests/SurfacePostureCoreTests.cpp -o surface-posture-tests
          ./surface-posture-tests
      - name: Validate clearance transport and bounded tightening proposals
        run: |
          g++ -std=c++20 -O1 -g -Wall -Wextra -pedantic -fsanitize=address,undefined -fno-omit-frame-pointer plugins/VanityUBEHeelAdapter/tests/StockingClearanceCoreTests.cpp -o stocking-clearance-tests
          ./stocking-clearance-tests

  build:
    needs: core-tests
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: '3.0.0'
      - name: Configure
        shell: pwsh
        run: |
          $env:SVS_BUILD_VERSION = '1.4.10'
          $env:SVS_BUILD_VERSION_STRING = '1.4.10-build13-compatible'
          xmake f -y --builddir=build/runtime/flat --skyrim_se=y --skyrim_ae=y --skyrim_vr=n -m releasedbg
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test portable cores with MSVC and Windows headers
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'MSVC installation not found' }
          $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          $tests = @('FootSnapshotCoreTests','TriMorphCoreTests','FootCapturePolicyTests','NifSourceCoreTests','SurfacePostureCoreTests','StockingClearanceCoreTests')
          foreach ($test in $tests) {
            cmd.exe /c "`"$vcvars`" && cl /nologo /EHsc /std:c++20 /W4 /DNOMINMAX /FIWindows.h plugins\VanityUBEHeelAdapter\tests\$test.cpp /Fe:$test.exe && $test.exe"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Build adapter
        shell: pwsh
        run: |
          xmake build -y VanityUBEHeelAdapter
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Stage MO2 package
        shell: pwsh
        run: |
          $dll = 'build/runtime/flat/windows/x64/releasedbg/VanityUBEHeelAdapter.dll'
          if (-not (Test-Path $dll)) { throw "Missing build output: $dll" }
          New-Item -ItemType Directory -Force -Path 'artifact/SKSE/Plugins' | Out-Null
          New-Item -ItemType Directory -Force -Path 'artifact/tools' | Out-Null
          Copy-Item $dll 'artifact/SKSE/Plugins/VanityUBEHeelAdapter.dll'
          Copy-Item 'plugins/VanityUBEHeelAdapter/config/VanityUBEHeelAdapter.json' 'artifact/SKSE/Plugins/VanityUBEHeelAdapter.json'
          Copy-Item 'plugins/VanityUBEHeelAdapter/PHASE14-TEST.md' 'artifact/PHASE14-TEST.md'
          Copy-Item 'plugins/VanityUBEHeelAdapter/tools/audit_foot_snapshots.py' 'artifact/tools/audit_foot_snapshots.py'
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VanityUBEHeelAdapter-POC
          path: artifact
          if-no-files-found: error
