name: Build Vanity UBE Heel Adapter POC

on:
  push:
    branches:
      - vanity-ube-heel-adapter-poc
  workflow_dispatch:

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate foot snapshot decoder with sanitizers
        run: |
          g++ -std=c++20 -O1 -g -Wall -Wextra -pedantic -fsanitize=address,undefined -fno-omit-frame-pointer plugins/VanityUBEHeelAdapter/tests/FootSnapshotCoreTests.cpp -o foot-snapshot-tests
          ./foot-snapshot-tests
      - name: Validate packed TRI parser and posture mathematics
        run: |
          g++ -std=c++20 -O1 -g -Wall -Wextra -pedantic -fsanitize=address,undefined -fno-omit-frame-pointer plugins/VanityUBEHeelAdapter/tests/TriMorphCoreTests.cpp -o tri-morph-tests
          ./tri-morph-tests
          python3 -m py_compile plugins/VanityUBEHeelAdapter/tools/audit_foot_snapshots.py
      - name: Validate live selection and retry policy
        run: |
          g++ -std=c++20 -O1 -g -Wall -Wextra -pedantic -fsanitize=address,undefined -fno-omit-frame-pointer plugins/VanityUBEHeelAdapter/tests/FootCapturePolicyTests.cpp -o foot-policy-tests
          ./foot-policy-tests
      - name: Validate source NIF and native coefficient fitting
        run: |
          g++ -std=c++20 -O1 -g -Wall -Wextra -pedantic -fsanitize=address,undefined -fno-omit-frame-pointer plugins/VanityUBEHeelAdapter/tests/NifSourceCoreTests.cpp -o nif-source-tests
          ./nif-source-tests
      - name: Validate cross-topology surface posture measurement
        run: |
          g++ -std=c++20 -O1 -g -Wall -Wextra -pedantic -fsanitize=address,undefined -fno-omit-frame-pointer plugins/VanityUBEHeelAdapter/tests/SurfacePostureCoreTests.cpp -o surface-posture-tests
          ./surface-posture-tests
      - name: Validate clearance transport and bounded tightening proposals
        run: |
          g++ -std=c++20 -O1 -g -Wall -Wextra -pedantic -fsanitize=address,undefined -fno-omit-frame-pointer plugins/VanityUBEHeelAdapter/tests/StockingClearanceCoreTests.cpp -o stocking-clearance-tests
          ./stocking-clearance-tests
      - name: Validate branch selection and transactional key restoration
        run: |
          g++ -std=c++20 -O1 -g -Wall -Wextra -pedantic -fsanitize=address,undefined -fno-omit-frame-pointer plugins/VanityUBEHeelAdapter/tests/HeightPlanTests.cpp -o height-plan-tests
          ./height-plan-tests
          python3 -m py_compile plugins/VanityUBEHeelAdapter/tools/replay_height.py
          g++ -std=c++20 -O2 -Wall -Wextra plugins/VanityUBEHeelAdapter/tools/replay_height.cpp -o replay-height
      - name: Validate barefoot versus unknown-footwear policy
        run: |
          g++ -std=c++20 -O1 -g -Wall -Wextra -pedantic -fsanitize=address,undefined -fno-omit-frame-pointer plugins/VanityUBEHeelAdapter/tests/BarefootPolicyTests.cpp -o barefoot-policy-tests
          ./barefoot-policy-tests
      - name: Validate extended heights and exact component subset correspondence
        run: |
          for test in ExtendedHeightTests TopologySubsetTests; do
            g++ -std=c++20 -O1 -g -fsanitize=address,undefined plugins/VanityUBEHeelAdapter/tests/$test.cpp -o "$test"
            ./"$test"
          done
      - name: Validate configuration, hot reload and editor
        run: |
          mkdir -p test-deps/nlohmann
          curl --fail --location --retry 3 https://raw.githubusercontent.com/nlohmann/json/v3.12.0/single_include/nlohmann/json.hpp -o test-deps/nlohmann/json.hpp
          for test in ConfigurationTests RuntimeConfigurationTests HeightProfileCacheTests; do
            g++ -std=c++20 -O0 -g -fsanitize=address,undefined -Itest-deps plugins/VanityUBEHeelAdapter/tests/$test.cpp -o "$test"
            ./"$test"
          done
          python3 plugins/VanityUBEHeelAdapter/tests/test_height_editor.py
          python3 plugins/VanityUBEHeelAdapter/tests/test_offline.py

  build:
    needs: core-tests
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: '3.0.0'
      - name: Configure
        shell: pwsh
        run: |
          $env:SVS_BUILD_VERSION = '1.4.10'
          $env:SVS_BUILD_VERSION_STRING = '1.4.10-build13-compatible'
          xmake f -y --builddir=build/runtime/flat --skyrim_se=y --skyrim_ae=y --skyrim_vr=n -m releasedbg
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test portable cores with MSVC and Windows headers
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'MSVC installation not found' }
          $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          $tests = @('FootSnapshotCoreTests','TriMorphCoreTests','FootCapturePolicyTests','NifSourceCoreTests','SurfacePostureCoreTests','StockingClearanceCoreTests','HeightPlanTests','BarefootPolicyTests','ExtendedHeightTests','TopologySubsetTests')
          foreach ($test in $tests) {
            cmd.exe /c "`"$vcvars`" && cl /nologo /EHsc /std:c++20 /W4 /DNOMINMAX /FIWindows.h plugins\VanityUBEHeelAdapter\tests\$test.cpp /Fe:$test.exe && $test.exe"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Test actual cache and capability I/O
        shell: pwsh
        run: |
          xmake build -y HeightProfileCacheTests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & build/runtime/flat/windows/x64/releasedbg/HeightProfileCacheTests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate full configuration and file workers on Windows
        shell: pwsh
        run: |
          foreach ($test in @('ConfigurationTests','RuntimeConfigurationTests')) {
            xmake build -y $test
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & "build/runtime/flat/windows/x64/releasedbg/$test.exe"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          python plugins/VanityUBEHeelAdapter/tests/test_height_editor.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python plugins/VanityUBEHeelAdapter/tests/test_offline.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build adapter
        shell: pwsh
        run: |
          xmake build -y VanityUBEHeelAdapter
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Stage MO2 package
        shell: pwsh
        run: |
          $dll = 'build/runtime/flat/windows/x64/releasedbg/VanityUBEHeelAdapter.dll'
          if (-not (Test-Path $dll)) { throw "Missing build output: $dll" }
          New-Item -ItemType Directory -Force -Path 'artifact/SKSE/Plugins' | Out-Null
          New-Item -ItemType Directory -Force -Path 'artifact/tools' | Out-Null
          Copy-Item $dll 'artifact/SKSE/Plugins/VanityUBEHeelAdapter.dll'
          Copy-Item 'plugins/VanityUBEHeelAdapter/config/VanityUBEHeelAdapter.json' 'artifact/SKSE/Plugins/VanityUBEHeelAdapter.json'
          Copy-Item 'plugins/VanityUBEHeelAdapter/RELEASE-0.16.0.md' 'artifact/RELEASE-0.16.0.md'
          Copy-Item 'plugins/VanityUBEHeelAdapter/tools/height_editor.py' 'artifact/tools/height_editor.py'
          Copy-Item 'plugins/VanityUBEHeelAdapter/tools/vha_offline.py' 'artifact/tools/vha_offline.py'
          Copy-Item 'plugins/VanityUBEHeelAdapter/tools/offline' 'artifact/tools/offline' -Recurse
          python plugins/VanityUBEHeelAdapter/tools/build_command_plugin.py --out artifact/VanityUBEHeelAdapter.Commands.esp
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item 'plugins/VanityUBEHeelAdapter/OFFLINE-0.17.0.md' 'artifact/OFFLINE-0.17.0.md'
          Copy-Item 'plugins/VanityUBEHeelAdapter/OFFLINE-0.17.0.zh-CN.md' 'artifact/OFFLINE-0.17.0.zh-CN.md'
          Copy-Item 'plugins/VanityUBEHeelAdapter/FIXES-0.16.1.md' 'artifact/FIXES-0.16.1.md'
          Copy-Item 'plugins/VanityUBEHeelAdapter/tools/audit_foot_snapshots.py' 'artifact/tools/audit_foot_snapshots.py'
          @{
            version = '0.17.0'
            commit = $env:GITHUB_SHA
            dllSha256 = (Get-FileHash 'artifact/SKSE/Plugins/VanityUBEHeelAdapter.dll' -Algorithm SHA256).Hash
          } | ConvertTo-Json | Set-Content -Encoding utf8 'artifact/BUILD.json'
          New-Item -ItemType Directory -Force -Path 'artifact/examples' | Out-Null
          Copy-Item 'plugins/VanityUBEHeelAdapter/config/VanityUBEHeelAdapter.user.example.json' 'artifact/examples/VanityUBEHeelAdapter.user.example.json'
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VanityUBEHeelAdapter-POC
          path: artifact
          if-no-files-found: error
