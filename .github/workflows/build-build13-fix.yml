name: Build Build13 render fix

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: build13-render-fix
          submodules: recursive
          fetch-depth: 0

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: '3.0.0'

      - name: Configure
        shell: pwsh
        run: |
          $env:SVS_BUILD_VERSION = '1.4.10'
          $env:SVS_BUILD_VERSION_STRING = '1.4.10-build13-fix'
          xmake f -y --builddir=build/runtime/flat --skyrim_se=y --skyrim_ae=y --skyrim_vr=n -m releasedbg
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build
        shell: pwsh
        run: |
          xmake build -y
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Stage MO2 override
        shell: pwsh
        run: |
          $dll = 'build/runtime/flat/windows/x64/releasedbg/SkyrimVanitySystem.dll'
          if (-not (Test-Path $dll)) { throw "Missing build output: $dll" }
          New-Item -ItemType Directory -Force -Path 'artifact/SKSE/Plugins' | Out-Null
          Copy-Item $dll 'artifact/SKSE/Plugins/SkyrimVanitySystem.dll'
          $pdb = 'build/runtime/flat/windows/x64/releasedbg/SkyrimVanitySystem.pdb'
          if (Test-Path $pdb) { Copy-Item $pdb 'artifact/SKSE/Plugins/SkyrimVanitySystem.pdb' }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SkyrimVanitySystem-Build13-Render-Fix
          path: artifact
          if-no-files-found: error
