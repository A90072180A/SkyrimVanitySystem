name: Adapter test dependency
on:
  push:
    branches: [vanity-ube-heel-adapter-poc]
    paths: [.github/workflows/export-test-dependency.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch the exact public header used by the build
        run: |
          mkdir -p dependency/nlohmann
          curl --fail --location --retry 3 https://raw.githubusercontent.com/nlohmann/json/v3.12.0/single_include/nlohmann/json.hpp -o dependency/nlohmann/json.hpp
          curl --fail --location --retry 3 https://raw.githubusercontent.com/nlohmann/json/v3.12.0/LICENSE.MIT -o dependency/LICENSE.MIT
          cd dependency && sha256sum nlohmann/json.hpp > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: adapter-json-v3.12.0
          path: dependency
          if-no-files-found: error
